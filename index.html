<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Менің сайтым</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f2f2f2;
            color: #222;
        }

        header {
            background: #222;
            color: white;
            padding: 20px;
            text-align: center;
        }

        nav {
            margin-top: 10px;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin: 0 15px;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 20px;
            text-align: center;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 15px #ccc;
        }

        button {
            margin-top: 20px;
            padding: 12px 25px;
            border: none;
            border-radius: 8px;
            background: #222;
            color: white;
            cursor: pointer;
        }

        button:hover {
            background: #555;
        }

        footer {
            margin-top: 50px;
            padding: 20px;
            background: #222;
            color: white;
            text-align: center;
        }
    </style>
</head>

<body>

<header>
    <h1>Менің сайтым</h1>

    <nav>
        <a href="#">Басты бет</a>
        <a href="#">Біз туралы</a>
        <a href="#">Байланыс</a>
    </nav>
</header>

<div class="container">
    <div class="card">
        <h2>Сәлем!</h2>
        <p>Бұл HTML, CSS және JavaScript арқылы жасалған қарапайым сайт.</p>

        <button onclick="showMessage()">Басып көр</button>
    </div>
</div>

<footer>
    © 2026 Менің сайтым
</footer>

<script>
    function showMessage() {
        alert("Сәлем! Сайт жұмыс істеп тұр 😎");
    }
</script>

</body>
</html>
